[project]
name = "capption"
version = "0.1.4"
description = "Local real-time captions for one application's audio"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION"]

[project.scripts]
capption-cli = "capption.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: needs real Windows APIs (skipped elsewhere)",
    "slow: loads ML models or decodes media",
]
